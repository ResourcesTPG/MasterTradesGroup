const map=L.map('map',{preferCanvas:true,zoomControl:true}).setView([39.5,-77],8);
L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors, Tiles &copy; OpenStreetMap France'}).addTo(map);
let selected=new Set(companies.map(c=>c.id)), showRings=true, showLines=false;const companyLayers={},schoolLayers={},ringLayers={},lineLayer=L.layerGroup().addTo(map);
function esc(v){return String(v==null?'Not reported':v).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
const fmt=v=>v==null||v===''?'Not reported':Number(v).toLocaleString('en-US');
companies.forEach(c=>{
 const m=L.circleMarker([c.lat,c.lon],{radius:12,fillColor:'#1769b0',color:'#fff',weight:3,fillOpacity:1}).bindPopup(`<b>${esc(c.name)}</b><br>${esc(c.address)}<br><b>${c.count} schools</b> within 10 miles<br>Enrollment reach: ${fmt(c.enrollment)}<br><span style="color:#566">Select only this location in the upper-right filter to isolate its schools.</span>`);
 m.on('click',()=>{selected=new Set([c.id]);update();});companyLayers[c.id]=m;
 ringLayers[c.id]=L.circle([c.lat,c.lon],{radius:16093.44,color:'#1769b0',weight:1.5,opacity:.6,fillColor:'#1769b0',fillOpacity:.035,interactive:false});
});
schools.forEach(s=>{
 const related=s.matches.map(m=>`${esc(companies[m.company].name)} (${Number(m.distance).toFixed(2)} mi)`).join('<br>');
 const m=L.circleMarker([s.lat,s.lon],{radius:5.5,fillColor:'#2f9d55',color:'#fff',weight:1.1,fillOpacity:.92}).bindPopup(`<b>${esc(s.name)}</b><br>${esc(s.address)}<br>Level: ${esc(s.level)}<br>Enrollment: ${fmt(s.enrollment)}<br>DMA: ${esc(s.dma)}<hr style="border:0;border-top:1px solid #ddd"><b>Within 10 miles of:</b><br>${related}`);
 schoolLayers[s.id]=m;
});
const schoolsGroup=L.layerGroup().addTo(map),companiesGroup=L.layerGroup().addTo(map),ringsGroup=L.layerGroup().addTo(map);
const Panel=L.Control.extend({options:{position:'topright'},onAdd(){let d=L.DomUtil.create('div','panel controls');d.innerHTML='<h3>Company location filters</h3><div class="hint">Select locations to show their matching schools.</div><div id="companyopts"></div><button class="btn" id="all">Show all</button><button class="btn" id="none">Clear</button><hr><label class="option"><input type="checkbox" id="rings" checked>Show 10-mile radius circles</label><label class="option"><input type="checkbox" id="lines">Connect selected locations to schools</label><div class="hint">Click a blue company marker to isolate its schools.</div>';L.DomEvent.disableClickPropagation(d);L.DomEvent.disableScrollPropagation(d);return d;}});map.addControl(new Panel());
const Legend=L.Control.extend({options:{position:'bottomleft'},onAdd(){let d=L.DomUtil.create('div','panel');d.innerHTML=`<img class="logo" src="${logo}" alt="Master Trades Group logo"><h3>Map legend</h3><div class="legendline"><span class="dot blue"></span><span>Company location (5 total)</span></div><div class="legendline"><span class="dot green"></span><span>Public high school (126 unique)</span></div><div class="hint">Light blue circles = 10-mile straight-line radius. School popups list corresponding company locations and distances.</div><div class="hint" style="margin-top:7px">Distances are straight-line, not driving distances.</div>`;L.DomEvent.disableClickPropagation(d);L.DomEvent.disableScrollPropagation(d);return d;}});map.addControl(new Legend());
const opts=document.getElementById('companyopts');companies.forEach(c=>{const l=document.createElement('label');l.className='option';l.innerHTML=`<input type="checkbox" value="${c.id}" checked><span><b>${esc(c.name)}</b><br><span class="small">${esc(c.city)}, ${esc(c.state)} · ${c.count} schools</span></span>`;opts.appendChild(l);l.querySelector('input').addEventListener('change',e=>{if(e.target.checked)selected.add(c.id);else selected.delete(c.id);update()})});
document.getElementById('all').onclick=()=>{selected=new Set(companies.map(c=>c.id));update()};document.getElementById('none').onclick=()=>{selected.clear();update()};document.getElementById('rings').onchange=e=>{showRings=e.target.checked;update()};document.getElementById('lines').onchange=e=>{showLines=e.target.checked;update()};
function update(){companiesGroup.clearLayers();schoolsGroup.clearLayers();ringsGroup.clearLayers();lineLayer.clearLayers();document.querySelectorAll('#companyopts input').forEach(e=>e.checked=selected.has(+e.value));const visible=schools.filter(s=>s.matches.some(m=>selected.has(m.company)));companies.forEach(c=>{if(selected.has(c.id)){companiesGroup.addLayer(companyLayers[c.id]);if(showRings)ringsGroup.addLayer(ringLayers[c.id])}});visible.forEach(s=>{schoolsGroup.addLayer(schoolLayers[s.id]);if(showLines)s.matches.filter(m=>selected.has(m.company)).forEach(m=>{const c=companies[m.company];lineLayer.addLayer(L.polyline([[c.lat,c.lon],[s.lat,s.lon]],{color:'#2f9d55',weight:1,opacity:.3,interactive:false}))})});const n=selected.size;document.getElementById('summary').textContent=n===5?`All 5 locations · ${visible.length} unique schools`:`${n} selected location${n===1?'':'s'} · ${visible.length} unique schools`;}
update();map.fitBounds(L.latLngBounds([...companies.map(c=>[c.lat,c.lon]),...schools.map(s=>[s.lat,s.lon])]),{padding:[35,35]});
</script></body></html>
